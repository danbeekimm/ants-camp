global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 10.178.0.5:9093

rule_files:
  - alert-rules.yaml

# ── app-ec2 IP: terraform apply 후 확정, 아래 10.178.0.2 교체 ──
# 현재 임시값: terraform output app_private_ip 로 확인
scrape_configs:
  - job_name: 'antcamp-config-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 10.0.2.121:8888

  - job_name: 'antcamp-eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 10.0.2.121:8761

  - job_name: 'antcamp-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 10.0.1.131:8080

  - job_name: 'antcamp-user'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 10.178.0.2:8082

  - job_name: 'antcamp-trade'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 10.178.0.2:8084

  - job_name: 'antcamp-asset'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 10.178.0.2:8086

  - job_name: 'antcamp-competition'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 10.178.0.2:8092

  - job_name: 'antcamp-ranking'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 10.178.0.2:8094

  - job_name: 'antcamp-assistant'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 10.178.0.2:8096

  - job_name: 'antcamp-notification'
    metrics_path: '/actuator/prometheus'
