spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  cloud:
    config:
      enabled: false

eureka:
  instance:
    prefer-ip-address: true          # 컨테이너 환경에서 hostname 대신 IP 사용 (hostname null 오류 방지)
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      probability: 0.0   # Zipkin 미사용 시 tracing 비활성화 (timeout 로그 방지)
  zipkin:
    tracing:
      export:
        enabled: false
