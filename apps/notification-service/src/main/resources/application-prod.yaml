spring:
  datasource:
    # localhost → RDS 엔드포인트로 오버라이드
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=${NOTIFICATION_SCHEMA:notification}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  cloud:
    config:
      enabled: false

management:
  tracing:
    sampling:
      probability: 0.0   # Zipkin 미사용 시 tracing 비활성화 (timeout 로그 방지)
  zipkin:
    tracing:
      export:
        enabled: false
