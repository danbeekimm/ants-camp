spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    properties:
      hibernate:
        default_schema: ${USER_SCHEMA:users}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    config:
      enabled: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST}:${EUREKA_SERVER_PORT:8761}/eureka/

management:
  tracing:
    sampling:
      probability: 0.0   # Zipkin 미사용 시 tracing 비활성화 (timeout 로그 방지)
  zipkin:
    tracing:
      export:
        enabled: false
