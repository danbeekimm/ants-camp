spring:
  config:
    # Docker Compose 서비스명 → 실제 EC2 IP로 오버라이드
    import: optional:configserver:http://${CONFIG_SERVER_HOST:10.0.2.121}:${CONFIG_SERVER_PORT:8888}
  cloud:
    config:
      enabled: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:10.0.2.121}:${EUREKA_SERVER_PORT:8761}/eureka/

management:
  tracing:
    sampling:
      probability: 0.0   # Zipkin 미사용 시 tracing 비활성화 (timeout 로그 방지)
  zipkin:
    tracing:
      export:
        enabled: false
