x-java-tz: &java-tz
  TZ: Asia/Seoul
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0"

# ──────────────────────────────────────────────────────────────────────────
# 단일 인스턴스(OCI Ampere A1 / Ubuntu aarch64 · 4vCPU · 24GB) 다운스케일 구성
#
# 원본 docker-compose.yml 대비 변경점
#   - zookeeper 제거 (Kafka KRaft 모드라 미사용)
#   - kafka-ui 제거 (개발 도구)
#   - zipkin 제거 + MANAGEMENT_TRACING_SAMPLING_PROBABILITY=0 (트레이싱 오버헤드 절감)
#   - kafka heap 캡(-Xmx512m), prometheus retention 3d/2GB
#   - 모든 앱 서비스에 restart: unless-stopped
#   - 앱 서비스에 SPRING_CLOUD_CONFIG_FAIL_FAST=true: 호스트 재부팅 시 restart 정책은
#     depends_on/healthcheck을 무시하고 동시 기동하므로, config-server에서 설정을 못 받으면
#     기본값으로 뜨는 대신 즉시 종료 → restart 정책이 재시도 (2026-07-20 게이트웨이 403 장애 재발 방지)
#   - 힙/메타스페이스 캡은 각 서비스 Dockerfile의 JAVA_OPTS 참조
#
# 포트 정책(보안): 퍼블릭 단일 인스턴스이므로
#   - 외부 공개: gateway(8080), grafana(모니터링)만 0.0.0.0 바인딩
#   - 그 외 전부 127.0.0.1 바인딩(컨테이너끼리는 docker 네트워크 서비스명으로 통신,
#     호스트에서는 SSH 터널/리버스 프록시로만 접근)
# ──────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: antcamp-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - .env
    volumes:
      - ./script/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - kafka-network

  redis:
    image: redis:7-alpine
    container_name: antcamp-redis
    ports:
      - "127.0.0.1:${SPRING_DATA_REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - kafka-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: antcamp-kafka
    mem_limit: 1280m
    ports:
      - "127.0.0.1:${KAFKA_PORT}:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: O9r3FldJQ3CbTqv1-OQibg
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - kafka-network

  eureka-server:
    image: ghcr.io/danbeekimm/eureka-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/eureka-server/Dockerfile
    container_name: antcamp-eureka-server
    mem_limit: 768m
    ports:
      - "127.0.0.1:${EUREKA_SERVER_PORT}:8761"
    environment:
      <<: *java-tz
      SERVER_PORT: 8761
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - kafka-network

  config-server:
    image: ghcr.io/danbeekimm/config-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/config-server/Dockerfile
    container_name: antcamp-config-server
    mem_limit: 768m
    ports:
      - "127.0.0.1:${CONFIG_SERVER_PORT}:8888"
    environment:
      <<: *java-tz
      SERVER_PORT: 8888
      CONFIG_GIT_URI: ${CONFIG_GIT_URI}
      CONFIG_GIT_BRANCH: ${CONFIG_GIT_BRANCH}
      SPRING_CLOUD_CONFIG_ENABLED: "false"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - kafka-network

  gateway-service:
    image: ghcr.io/danbeekimm/api-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: antcamp-gateway
    mem_limit: 1g
    ports:
      # nginx가 api.antscamp.site(443) → 이 포트로 proxy_pass → 127.0.0.1 바인딩
      - "127.0.0.1:${GATEWAY_SERVER_PORT}:8080"
    environment:
      <<: *java-tz
      SERVER_PORT: 8080
      SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    env_file:
      - .env
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kafka-network

  user-service:
    image: ghcr.io/danbeekimm/user-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: antcamp-user
    mem_limit: 768m
    ports:
      - "127.0.0.1:${USER_SERVER_PORT}:8082"
    environment:
      <<: *java-tz
      SERVER_PORT: 8082
      SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=${USER_SCHEMA}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
    env_file:
      - .env
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kafka-network

  trade-service:
    image: ghcr.io/danbeekimm/trade-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/trade-service/Dockerfile
    container_name: antcamp-trade
    mem_limit: 1280m
    ports:
      - "127.0.0.1:${TRADE_SERVER_PORT}:8084"
    environment:
      <<: *java-tz
      SERVER_PORT: ${TRADE_SERVER_PORT}
      SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=${TRADE_SCHEMA}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_URL: ${SPRING_DATA_REDIS_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      KIS_WS_URL: ${KIS_WS_URL}
      KIS_APPROVAL_URL: ${KIS_APPROVAL_URL}
      KIS_REST_URL: ${KIS_REST_URL}
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      KIS_APP_ACCESS: ${KIS_APP_ACCESS}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kafka-network

  asset-service:
    image: ghcr.io/danbeekimm/asset-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/asset-service/Dockerfile
    container_name: antcamp-asset
    mem_limit: 768m
    ports:
      - "127.0.0.1:${ASSET_SERVER_PORT}:8086"
    environment:
      <<: *java-tz
      SERVER_PORT: ${ASSET_SERVER_PORT}
      SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=${ASSET_SCHEMA}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kafka-network

  competition-service:
    image: ghcr.io/danbeekimm/competition-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/competition-service/Dockerfile
    container_name: antcamp-competition
    mem_limit: 768m
    ports:
      - "127.0.0.1:${COMPETITION_SERVER_PORT}:8092"
    environment:
      <<: *java-tz
      SPRING_PROFILES_ACTIVE: default
      SERVER_PORT: ${COMPETITION_SERVER_PORT}
      SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=${COMPETITION_SCHEMA}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kafka-network

  ranking-service:
    image: ghcr.io/danbeekimm/ranking-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/ranking-service/Dockerfile
    container_name: antcamp-ranking
    mem_limit: 768m
    ports:
      - "127.0.0.1:${RANKING_SERVER_PORT}:8094"
    environment:
      <<: *java-tz
      SPRING_PROFILES_ACTIVE: default
      SERVER_PORT: ${RANKING_SERVER_PORT}
      SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=${RANKING_SCHEMA}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kafka-network

  assistant-service:
    image: ghcr.io/danbeekimm/assistant-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/assistant-service/Dockerfile
    container_name: antcamp-assistant
    mem_limit: 1280m
    ports:
      - "127.0.0.1:${ASSISTANT_SERVER_PORT}:8096"
    environment:
      <<: *java-tz
      ASSISTANT_SERVER_PORT: ${ASSISTANT_SERVER_PORT}
      SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=${ASSISTANT_SCHEMA},public
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ASSISTANT_LLM_MODEL_NAME: ${ANTHROPIC_CHAT_MODEL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kafka-network

  notification-service:
    image: ghcr.io/danbeekimm/notification-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: antcamp-notification
    mem_limit: 1g
    ports:
      - "127.0.0.1:${NOTIFICATION_SERVER_PORT}:8098"
    environment:
      <<: *java-tz
      SERVER_PORT: ${NOTIFICATION_SERVER_PORT}
      SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=${NOTIFICATION_SCHEMA}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      PROMETHEUS_URL: http://prometheus:${PROMETHEUS_PORT}
      GRAFANA_URL: https://watch.antscamp.site
      LOKI_URL: http://loki:${LOKI_PORT}
      REDIS_HOST: redis
      REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kafka-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    environment:
      - TZ=Asia/Seoul
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - ./monitoring/prometheus/alert-rules.yaml:/etc/prometheus/alert-rules.yaml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.retention.size=2GB'
    networks:
      - kafka-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT}:9093"
    environment:
      - TZ=Asia/Seoul
      - SLACK_ALERTMANAGER_WEBHOOK_URL=${SLACK_ALERTMANAGER_WEBHOOK_URL}
      - WEBHOOK_SHARED_SECRET=${WEBHOOK_SHARED_SECRET}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - 'sed "s|\$${SLACK_ALERTMANAGER_WEBHOOK_URL}|$$SLACK_ALERTMANAGER_WEBHOOK_URL|g; s|\$${WEBHOOK_SHARED_SECRET}|$$WEBHOOK_SHARED_SECRET|g" /etc/alertmanager/alertmanager.yaml > /tmp/am.yaml && /bin/alertmanager --config.file=/tmp/am.yaml'
    networks:
      - kafka-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      # nginx가 watch.antscamp.site(443) → 이 포트로 proxy_pass → 127.0.0.1 바인딩
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    environment:
      - TZ=Asia/Seoul
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    env_file:
      - .env
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - kafka-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    environment:
      - TZ=Asia/Seoul
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki.yaml
    networks:
      - kafka-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    environment:
      - TZ=Asia/Seoul
      - DOCKER_API_VERSION=1.44
    volumes:
      - ./monitoring/promtail/promtail.yaml:/etc/promtail/promtail.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/promtail.yaml
    networks:
      - kafka-network
    restart: unless-stopped
    depends_on:
      - loki


volumes:
  postgres-data:
  redisdata:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:

networks:
  kafka-network:
    driver: bridge
