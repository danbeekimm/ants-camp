name: AntCamp CD

# dev push → 변경 서비스 감지 → ARM 이미지 빌드(GHCR) → SSH로 인스턴스 pull 배포
#   - 공통(common/, 루트 gradle, compose, 이 파일) 변경 시 전체 빌드
#   - 수동 실행: deploy_all=true 면 전체 빌드+배포, false 면 빌드 없이 재배포만(pull+up)

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: '모든 서비스 강제 빌드 후 배포'
        type: boolean
        default: false

concurrency:
  group: antcamp-cd
  cancel-in-progress: false

jobs:
  detect:
    name: 변경 감지
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
      any: ${{ steps.set.outputs.any }}
      deploy: ${{ steps.set.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            core:
              - 'common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'docker-compose.lite.yml'
              - '.github/workflows/cd.yml'
            api-gateway:
              - 'apps/api-gateway/**'
            asset-service:
              - 'apps/asset-service/**'
            assistant-service:
              - 'apps/assistant-service/**'
            competition-service:
              - 'apps/competition-service/**'
            config-server:
              - 'apps/config-server/**'
            eureka-server:
              - 'apps/eureka-server/**'
            notification-service:
              - 'apps/notification-service/**'
            ranking-service:
              - 'apps/ranking-service/**'
            trade-service:
              - 'apps/trade-service/**'
            user-service:
              - 'apps/user-service/**'

      - name: 빌드 대상 산출
        id: set
        env:
          EVENT: ${{ github.event_name }}
          DEPLOY_ALL: ${{ inputs.deploy_all }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          ALL='["api-gateway","asset-service","assistant-service","competition-service","config-server","eureka-server","notification-service","ranking-service","trade-service","user-service"]'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$DEPLOY_ALL" = "true" ]; then
              SERVICES="$ALL"
            else
              SERVICES="[]"   # 빌드 없이 현재 GHCR 이미지로 재배포만
            fi
          elif echo "$CHANGED" | jq -e 'index("core")' > /dev/null; then
            SERVICES="$ALL"
          else
            SERVICES=$(echo "$CHANGED" | jq -c .)
          fi
          ANY=$(echo "$SERVICES" | jq -r 'length > 0')
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$ANY" = "true" ]; then
            DEPLOY=true
          else
            DEPLOY=false
          fi
          {
            echo "services=$SERVICES"
            echo "any=$ANY"
            echo "deploy=$DEPLOY"
          } >> "$GITHUB_OUTPUT"
          echo "빌드 대상: $SERVICES / 배포: $DEPLOY"

  build:
    name: 이미지 빌드 (${{ matrix.service }})
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: 인스턴스 배포
    needs: [detect, build]
    if: ${{ !cancelled() && needs.detect.outputs.deploy == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH 배포 (git 동기화 → pull → up)
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: ${{ secrets.OCI_APP_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || 22 }}
          envs: APP_DIR,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            git fetch origin dev
            git reset --hard origin/dev
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.lite.yml pull
            docker compose -f docker-compose.lite.yml up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
            docker compose -f docker-compose.lite.yml ps
